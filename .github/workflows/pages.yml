name: Publish website collection
on:
  push:
    branches: [collection, redesign-v2]
  pull_request:
    branches: [trunk, collection]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --package-lock=false
      - run: npm run build
        env:
          SITE_BASE: /twenty-web-studies/
      - uses: actions/upload-pages-artifact@v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/collection') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/collection' || github.ref == 'refs/heads/redesign-v2'))
        with:
          path: dist
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/collection') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/collection' || github.ref == 'refs/heads/redesign-v2'))
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
